<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Álcool ou Gasolina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-img class="logo-principal" src="/assets/logo.png"></ion-img>
      </ion-col>

      <ion-col size="12">
        <h4>Saiba qual é a melhor opção para o seu carrO.</h4>
      </ion-col>

      <ion-col size="12">
        <ion-item fill="outline" shape="round" class="ion-margin-bottom">
          <ion-label position="floating">Nome do Posto (Opcional)</ion-label>
          <ion-input type="text" [(ngModel)]="nomePosto"></ion-input>
        </ion-item>

        <ion-item fill="outline" shape="round" class="ion-margin-bottom">
          <ion-label position="floating">Preço álcool, ex: 3.50</ion-label>
          <ion-input type="number" [(ngModel)]="precoAlcool"></ion-input>
        </ion-item>

        <ion-item fill="outline" shape="round" class="ion-margin-bottom">
          <ion-label position="floating">Preço gasolina, ex: 5.00</ion-label>
          <ion-input type="number" [(ngModel)]="precoGasolina"></ion-input>
        </ion-item>

        <ion-button expand="full" (click)="calcular()">
          <ion-icon slot="start" name="calculator-outline"></ion-icon>
          Calcular
        </ion-button>
      </ion-col>
    </ion-row>

    @if (resultado) {
      <ion-row>
        <ion-col size="12">
          <!-- Este é um estilo melhor para o resultado, para dar cor -->
          <div
            class="ion-text-center ion-padding ion-margin-top result-box"
            [class.resultado-alcool]="resultado.includes('Álcool')"
            [class.resultado-gasolina]="resultado.includes('Gasolina')"
          >
            <h5>{{ resultado }}</h5>
          </div>
        </ion-col>
      </ion-row>
    }

    <!-- Botões de Navegação -->
    <ion-row class="ion-margin-top">
      <ion-col size="12" size-md="4">
        <ion-button expand="full" fill="outline" routerLink="/historico">
          <ion-icon slot="start" name="bookmarks-outline"></ion-icon>
          Histórico
        </ion-button>
      </ion-col>
      <ion-col size="12" size-md="4">
        <ion-button expand="full" fill="outline" routerLink="/cadastro-veiculo">
          <ion-icon slot="start" name="car-sport-outline"></ion-icon>
          Veículo
        </ion-button>
      </ion-col>
      <!-- NOVO BOTÃO ADICIONADO AQUI -->
      <ion-col size="12" size-md="4">
        <ion-button expand="full" fill="outline" routerLink="/desempenho">
          <ion-icon slot="start" name="stats-chart-outline"></ion-icon>
          Desempenho
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
